<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shree Krishna Fireworks – Price List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --ink: #1b1c20;
  --muted: #5f626c;
  --line: #dddbd3;
  --chip-bg: #eeede8;
  --accent: #1f2a52;
  --accent-ink: #ffffff;
  --hl: rgba(31, 42, 82, .13);
  --font: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121318; --surface: #1a1c23; --ink: #ececf0; --muted: #a2a5b0; --line: #2d303a;
    --chip-bg: #252833; --accent: #c9d2f6; --accent-ink: #121318; --hl: rgba(159, 176, 239, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121318; --surface: #1a1c23; --ink: #ececf0; --muted: #a2a5b0; --line: #2d303a;
  --chip-bg: #252833; --accent: #c9d2f6; --accent-ink: #121318; --hl: rgba(159, 176, 239, .28);
  color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header: stays white in both themes so the logos sit on their own background */
header { background: #fff; border-bottom: 1px solid #e3e1da; }
.head { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
.badge { width: 56px; height: 56px; flex: none; display: block; }
.wordmark { height: 52px; width: auto; max-width: 56vw; display: block; }
.tag { margin-left: auto; font-size: 15px; color: #6b6e78; }
@media (max-width: 460px) {
  .tag { display: none; }
  .badge { width: 48px; height: 48px; }
  .wordmark { height: 44px; }
}

/* Sticky tools */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 960px; margin: 0 auto; padding: 10px 16px 12px; display: flex; gap: 12px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.grow { flex: 1; }
.field > label { font-size: 13px; font-weight: 600; color: var(--muted); }

.search { position: relative; }
.search input {
  width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  font-size: 16px; padding: 0 44px 0 42px; outline: none;
}
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.search .ico { position: absolute; left: 13px; top: 15px; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.search .clear { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: none; color: var(--muted); border-radius: 8px; display: none; align-items: center; justify-content: center; }
.search .clear svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.search.has-text .clear { display: flex; }

.stepper { display: flex; align-items: stretch; height: 48px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.stepper button { width: 44px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--ink); }
.stepper button:active { background: var(--chip-bg); }
.stepper button:focus-visible { outline-offset: -3px; }
.stepper .val { display: flex; align-items: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0 10px 0 4px; }
.stepper input { width: 56px; border: 0; background: none; text-align: right; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none; -moz-appearance: textfield; appearance: textfield; padding: 0 2px; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .val:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.stepper .pc { font-size: 16px; color: var(--muted); }

main { max-width: 960px; margin: 0 auto; padding: 14px 16px 24px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 12px; margin: 0 -16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.filters::-webkit-scrollbar { display: none; }
@media (min-width: 700px) { .filters { flex-wrap: wrap; overflow: visible; padding: 2px 0 12px; margin: 0; } }
.filter { flex: none; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 15px; white-space: nowrap; }
.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.count { font-size: 14px; color: var(--muted); margin: 0 0 10px 2px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 700px) { .list { grid-template-columns: 1fr 1fr; gap: 10px; } }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.info { min-width: 0; }
.name { font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 13px; line-height: 1; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.chip.cat { background: var(--chip-bg); color: var(--muted); }
.chip.unit { border: 1px solid var(--line); color: var(--muted); }
.price { flex: none; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
mark { background: var(--hl); color: inherit; border-radius: 2px; }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }
.empty button { margin-top: 16px; height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
footer { max-width: 960px; margin: 0 auto; padding: 0 16px 28px; font-size: 13px; color: var(--muted); }
.tabs { background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 960px; margin: 0 auto; padding: 0 16px; display: flex; gap: 24px; }
.tab { height: 48px; padding: 0 2px; border: 0; border-bottom: 3px solid transparent; background: none; font-size: 16px; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tab:focus-visible { outline-offset: -4px; }
.settings { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
@media (min-width: 700px) { .settings { grid-template-columns: 1fr 1fr; align-items: start; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.panel h2 { margin: 0 0 4px; font-size: 18px; }
.panel p { margin: 0 0 14px; font-size: 15px; color: var(--muted); }
.panel .field { align-items: flex-start; }
.preview { list-style: none; margin: 0; padding: 0; }
.preview li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.preview li:first-child { border-top: 0; padding-top: 0; }
.preview .pv { flex: none; font-variant-numeric: tabular-nums; color: var(--muted); }
.preview .pv strong { color: var(--ink); font-size: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .filter, .stepper button, .search input { transition: background-color .12s, border-color .12s; }
}
</style>
</head>

<script>
const ITEMS = JSON.parse(document.getElementById('items').textContent);
const $q = document.getElementById('q'), $p = document.getElementById('pct');
const $list = document.getElementById('list'), $count = document.getElementById('count');
const $filters = document.getElementById('filters'), $search = document.getElementById('search');
const CATS = ITEMS.reduce((a, r) => (a.includes(r[1]) ? a : a.concat(r[1])), []);
let cat = '';

try { const s = localStorage.getItem('sk-pct'); if (s !== null && s !== '' && !isNaN(+s) && +s >= 0) $p.value = s; } catch (e) {}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function price(base, pct) {
  return Math.ceil(base * (1 + pct / 100) / 5 - 1e-9) * 5;
}
const money = n => '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
function drawPreview(pct) {
  document.getElementById('preview').innerHTML = ITEMS.slice(0, 3).map(([n, c, u, b]) =>
    '<li><span>' + esc(n) + '</span><span class="pv">' + money(b) + ' → <strong>' + money(price(b, pct)) + '</strong></span></li>'
  ).join('');
}
function drawFilters() {
  $filters.innerHTML = ['All'].concat(CATS).map(c => {
    const on = (c === 'All' && !cat) || c === cat;
    return '<button type="button" class="filter" data-cat="' + (c === 'All' ? '' : esc(c)) + '" aria-pressed="' + on + '">' + esc(c) + '</button>';
  }).join('');
}
function render() {
  const raw = $q.value.trim(), q = raw.toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  let pct = parseFloat($p.value); if (isNaN(pct) || pct < 0) pct = 0;
  try { localStorage.setItem('sk-pct', String(pct)); } catch (e) {}
  drawPreview(pct);
  $search.classList.toggle('has-text', $q.value.length > 0);
  const rows = ITEMS.filter(([n, c, u]) => {
    if (cat && c !== cat) return false;
    const hay = (n + ' ' + c + ' ' + u).toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  $count.textContent = rows.length + (rows.length === 1 ? ' item' : ' items') + (cat ? ' in ' + cat : '');
  if (!rows.length) {
    $list.innerHTML = '<li class="empty" style="grid-column:1/-1"><strong>No items found</strong>Check the spelling or try fewer words.<br><button type="button" id="reset">Clear search and filter</button></li>';
    return;
  }
  const one = terms.length === 1 ? terms[0] : '';
  $list.innerHTML = rows.map(([n, c, u, b]) =>
    '<li class="item"><div class="info"><div class="name">' + hl(n, one) + '</div>' +
    '<div class="chips"><span class="chip cat">' + hl(c, one) + '</span><span class="chip unit">per ' + hl(u, one) + '</span></div></div>' +
    '<div class="price">₹' + price(b, pct).toLocaleString('en-IN') + '</div></li>'
  ).join('');
}
function bump(d) {
  let v = parseFloat($p.value); if (isNaN(v)) v = 0;
  $p.value = Math.max(0, Math.round((v + d) * 100) / 100);
  render();
}
document.getElementById('inc').addEventListener('click', () => bump(5));
document.getElementById('dec').addEventListener('click', () => bump(-5));
document.getElementById('clear').addEventListener('click', () => { $q.value = ''; render(); $q.focus(); });
$filters.addEventListener('click', e => {
  const b = e.target.closest('.filter'); if (!b) return;
  cat = b.dataset.cat; drawFilters(); render();
});
$list.addEventListener('click', e => {
  if (e.target.id === 'reset') { $q.value = ''; cat = ''; drawFilters(); render(); }
});
$q.addEventListener('input', render);
$q.addEventListener('keydown', e => { if (e.key === 'Enter') $q.blur(); });
$p.addEventListener('input', render);
$p.addEventListener('focus', () => $p.select());
$p.addEventListener('keydown', e => { if (e.key === 'Enter') $p.blur(); });
const TABS = ['list', 'settings'];
function showTab(name, focus) {
  TABS.forEach(t => {
    const on = t === name, b = document.getElementById('tab-' + t);
    b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1;
    document.getElementById('panel-' + t).hidden = !on;
    if (on && focus) b.focus();
  });
  window.scrollTo(0, 0);
}
document.querySelector('[role=tablist]').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (b) showTab(b.id.replace('tab-', ''));
});
document.querySelector('[role=tablist]').addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  showTab(TABS[(TABS.indexOf(document.activeElement.id.replace('tab-', '')) + 1) % 2], true);
});
drawFilters();
render();
</script>
